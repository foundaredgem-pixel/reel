<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💎 Insta Reel Poster</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff;font-family:Arial;display:flex;justify-content:center}.wrap{width:100%;max-width:560px;padding:22px 16px 40px}.card{background:#151518;border:1px solid #2d2d33;border-radius:18px;padding:20px}h1{margin:0 0 6px}.sub,.note{color:#999;font-size:14px;line-height:1.5}.cover{width:100%;max-height:280px;object-fit:contain;background:#fff;border-radius:14px;margin:18px 0}label{display:block;font-weight:bold;margin:15px 0 8px}input,textarea{width:100%;background:#0c0c0f;color:#fff;border:1px solid #393940;border-radius:13px;padding:13px;font-size:16px}textarea{min-height:130px}button{width:100%;margin-top:18px;border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:bold}#status{margin-top:16px;padding:14px;border-radius:13px;background:#0c0c0f;white-space:pre-wrap;word-break:break-word}</style></head><body><div class="wrap"><div class="card"><h1>💎 Insta Reel Poster</h1><div class="sub">Manual posting works here. You can also send Reels to the meme account by Instagram DM.</div><img class="cover" src="/cover.jpg"><label>Instagram Reel link</label><input id="url" placeholder="https://www.instagram.com/reel/..."><label>Caption</label><textarea id="caption" placeholder="Write your caption..."></textarea><div id="keyWrap" hidden><label>App key</label><input id="appKey" type="password"></div><button id="post">POST REEL</button><div id="status" hidden></div><div class="note">DM automation only processes approved sender IDs. Instagram credentials stay on the server.</div></div></div><script>const $=x=>document.getElementById(x),b=$("post"),s=$("status");function show(x){s.hidden=false;s.textContent=x}async function read(r){let t=await r.text(),d=null;try{d=t?JSON.parse(t):null}catch(_){}if(!r.ok)throw Error((d?.detail||t||`HTTP ${r.status}`).replace(/<[^>]*>/g,""));if(!d)throw Error("Server returned an invalid response.");return d}async function go(){let u=$("url").value.trim(),c=$("caption").value.trim();if(!/^https?:\\/\\/(www\\.)?instagram\\.com\\/(reel|reels|p)\\//i.test(u))return show("Please enter an Instagram Reel URL.");b.disabled=true;show("Starting…");try{let d=await read(await fetch("/api/post",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reel_url:u,caption:c,app_key:$("appKey").value})}));for(;;){await new Promise(r=>setTimeout(r,2000));let x=await read(await fetch("/api/status/"+d.job_id,{cache:"no-store"}));show(x.message||"Working…");if(x.status==="done"||x.status==="error")break}}catch(e){show("❌ "+e.message)}finally{b.disabled=false}}b.onclick=go;$("caption").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}};(async()=>{try{let d=await read(await fetch("/api/config"));$("keyWrap").hidden=!d.app_key_required}catch(e){show(e.message)}})()</script></body></html>
